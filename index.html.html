<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>違紀交易紀錄表</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: "Microsoft JhengHei", "微軟正黑體", sans-serif;
      background: #0f1117;
      color: #e0e0e0;
      min-height: 100vh;
      padding: 24px 16px;
    }

    h1 {
      text-align: center;
      font-size: 1.6rem;
      color: #ff4d4d;
      margin-bottom: 6px;
      letter-spacing: 2px;
    }

    .subtitle {
      text-align: center;
      font-size: 0.82rem;
      color: #888;
      margin-bottom: 28px;
    }

    /* ── 統計卡片 ── */
    .stats {
      display: flex;
      gap: 16px;
      justify-content: center;
      flex-wrap: wrap;
      margin-bottom: 28px;
    }

    .card {
      background: #1a1d26;
      border: 1px solid #2a2d3a;
      border-radius: 10px;
      padding: 16px 24px;
      text-align: center;
      min-width: 130px;
    }

    .card-label { font-size: 0.73rem; color: #888; margin-bottom: 4px; }
    .card-value { font-size: 1.45rem; font-weight: bold; }
    .card-value.red    { color: #ff4d4d; }
    .card-value.green  { color: #4dff91; }
    .card-value.amber  { color: #ffb347; }
    .card-value.gray   { color: #aaa; }
    .card-value.purple { color: #c470ff; }

    /* ── 新增表單 ── */
    .form-box {
      background: #1a1d26;
      border: 1px solid #2a2d3a;
      border-radius: 12px;
      padding: 20px 24px;
      max-width: 820px;
      margin: 0 auto 28px;
    }

    .form-box h2 { font-size: 0.95rem; color: #aaa; margin-bottom: 16px; }

    .form-row {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      align-items: flex-end;
    }

    .field { display: flex; flex-direction: column; gap: 6px; flex: 1; min-width: 140px; }
    .field.reason { flex: 3; min-width: 220px; }
    .field label { font-size: 0.78rem; color: #888; }

    input, select, textarea {
      background: #0f1117;
      border: 1px solid #333;
      border-radius: 7px;
      color: #e0e0e0;
      padding: 9px 12px;
      font-family: inherit;
      font-size: 0.9rem;
      outline: none;
      transition: border 0.2s;
    }
    input:focus, select:focus, textarea:focus { border-color: #ff4d4d66; }
    textarea { resize: vertical; min-height: 42px; }

    /* 結果切換 */
    .result-toggle {
      display: flex;
      border-radius: 7px;
      overflow: hidden;
      border: 1px solid #333;
    }
    .result-toggle input[type=radio] { display: none; }
    .result-toggle label {
      flex: 1;
      text-align: center;
      padding: 9px 10px;
      font-size: 0.85rem;
      cursor: pointer;
      color: #666;
      background: #0f1117;
      transition: all 0.18s;
      user-select: none;
    }
    #rt-loss:checked   ~ label[for=rt-loss]   { background: #4a1a1a; color: #ff6060; font-weight: 600; }
    #rt-profit:checked ~ label[for=rt-profit] { background: #1a3a2a; color: #4dff91; font-weight: 600; }
    #rt-less:checked   ~ label[for=rt-less]   { background: #2a2a1a; color: #ffd060; font-weight: 600; }
    #rt-earn:checked   ~ label[for=rt-earn]   { background: #1a2a3a; color: #70d4ff; font-weight: 600; }

    button.add-btn {
      background: #c0392b;
      color: #fff;
      border: none;
      border-radius: 7px;
      padding: 9px 22px;
      font-size: 0.9rem;
      cursor: pointer;
      font-family: inherit;
      white-space: nowrap;
      transition: background 0.2s;
      align-self: flex-end;
    }
    button.add-btn:hover { background: #e74c3c; }

    /* ── 篩選列 ── */
    .filter-row {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      max-width: 820px;
      margin: 0 auto 16px;
      align-items: center;
    }
    .filter-row input, .filter-row select { font-size: 0.82rem; padding: 7px 10px; }
    .filter-row .clear-btn {
      background: transparent;
      border: 1px solid #444;
      color: #aaa;
      border-radius: 7px;
      padding: 7px 14px;
      cursor: pointer;
      font-family: inherit;
      font-size: 0.82rem;
      transition: all 0.2s;
    }
    .filter-row .clear-btn:hover { border-color: #ff4d4d; color: #ff4d4d; }

    /* ── 表格 ── */
    .table-wrap {
      max-width: 820px;
      margin: 0 auto;
      overflow-x: auto;
      border-radius: 12px;
      border: 1px solid #2a2d3a;
    }

    table { width: 100%; border-collapse: collapse; font-size: 0.88rem; }
    thead tr { background: #1e212e; }
    thead th {
      padding: 12px 14px;
      text-align: left;
      font-weight: 600;
      color: #aaa;
      font-size: 0.78rem;
      letter-spacing: 0.5px;
      white-space: nowrap;
      cursor: pointer;
      user-select: none;
    }
    thead th:hover { color: #ff4d4d; }

    tbody tr { border-top: 1px solid #1e212e; transition: background 0.15s; }
    tbody tr:hover { background: #1a1d2a; }
    td { padding: 11px 14px; vertical-align: top; }

    .td-date   { white-space: nowrap; color: #aaa; font-size: 0.82rem; }
    .td-amount { font-weight: bold; white-space: nowrap; }
    .td-amount.is-loss   { color: #ff4d4d; }
    .td-amount.is-profit { color: #4dff91; }
    .td-amount.is-less   { color: #ffd060; }
    .td-amount.is-earn   { color: #70d4ff; }
    .td-cat    { white-space: nowrap; }
    .td-reason { color: #ccc; line-height: 1.5; word-break: break-all; }

    .result-badge {
      display: inline-block;
      border-radius: 4px;
      padding: 2px 8px;
      font-size: 0.72rem;
      font-weight: 700;
      white-space: nowrap;
    }
    .rb-loss   { background: #4a1a1a; color: #ff7070; }
    .rb-profit { background: #1a3a2a; color: #4dff91; }
    .rb-less   { background: #2a2a1a; color: #ffd060; }
    .rb-earn   { background: #1a2a3a; color: #70d4ff; }

    .tag {
      display: inline-block;
      border-radius: 4px;
      padding: 2px 8px;
      font-size: 0.75rem;
      font-weight: 600;
      margin-left: 4px;
    }
    .tag-心態 { background: #3a1a1a; color: #ff7070; }
    .tag-停損 { background: #1a2a4a; color: #70aaff; }
    .tag-倉位 { background: #2a1a4a; color: #b070ff; }
    .tag-進場 { background: #1a3a2a; color: #70ffaa; }
    .tag-出場 { background: #3a2a1a; color: #ffcc70; }
    .tag-其他 { background: #2a2a2a; color: #aaa; }

    .del-btn {
      background: transparent;
      border: none;
      color: #555;
      cursor: pointer;
      font-size: 1rem;
      padding: 2px 6px;
      border-radius: 4px;
      transition: color 0.2s;
    }
    .del-btn:hover { color: #ff4d4d; }

    .empty-msg { text-align: center; padding: 40px; color: #555; font-size: 0.88rem; }

    /* ── 匯出 ── */
    .action-row {
      max-width: 820px;
      margin: 16px auto 0;
      display: flex;
      justify-content: flex-end;
    }
    .export-btn {
      background: #1a1d26;
      border: 1px solid #333;
      color: #aaa;
      border-radius: 7px;
      padding: 7px 16px;
      font-size: 0.82rem;
      cursor: pointer;
      font-family: inherit;
      transition: all 0.2s;
    }
    .export-btn:hover { border-color: #ff4d4d; color: #ff4d4d; }
    .import-btn {
      background: #1a1d26;
      border: 1px solid #333;
      color: #aaa;
      border-radius: 7px;
      padding: 7px 16px;
      font-size: 0.82rem;
      cursor: pointer;
      font-family: inherit;
      transition: all 0.2s;
    }
    .import-btn:hover { border-color: #4dff91; color: #4dff91; }
    #import-file-input { display: none; }

    .sort-arrow { font-size: 0.65rem; margin-left: 3px; }

    /* ── 教訓彈出框 ── */
    .toast-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.65);
      z-index: 999;
      align-items: center;
      justify-content: center;
    }
    .toast-overlay.show { display: flex; }

    .toast-box {
      background: #1a1d26;
      border-radius: 14px;
      max-width: 440px;
      width: 90%;
      padding: 32px 28px 24px;
      text-align: center;
      animation: popIn 0.25s ease;
    }
    .toast-box.style-loss   { border: 1px solid #c0392b; box-shadow: 0 0 40px #c0392b44; }
    .toast-box.style-profit { border: 1px solid #27ae60; box-shadow: 0 0 40px #27ae6044; }
    .toast-box.style-less   { border: 1px solid #d4a017; box-shadow: 0 0 40px #d4a01744; }
    .toast-box.style-earn   { border: 1px solid #1a7abf; box-shadow: 0 0 40px #1a7abf44; }

    @keyframes popIn {
      from { transform: scale(0.85); opacity: 0; }
      to   { transform: scale(1);    opacity: 1; }
    }

    .toast-icon { font-size: 2.2rem; margin-bottom: 12px; }
    .toast-amount { font-size: 1.6rem; font-weight: bold; margin-bottom: 4px; }
    .toast-amount.is-loss   { color: #ff4d4d; }
    .toast-amount.is-profit { color: #4dff91; }
    .toast-amount.is-less   { color: #ffd060; }
    .toast-amount.is-earn   { color: #70d4ff; }
    .toast-amount-label { font-size: 0.78rem; color: #888; margin-bottom: 20px; }
    .toast-divider { border: none; border-top: 1px solid #2a2d3a; margin: 0 0 20px; }
    .toast-quote {
      font-size: 0.98rem;
      line-height: 1.75;
      color: #e0c080;
      font-style: italic;
      margin-bottom: 22px;
    }
    .toast-close {
      color: #fff;
      border: none;
      border-radius: 8px;
      padding: 9px 28px;
      font-size: 0.9rem;
      cursor: pointer;
      font-family: inherit;
      transition: filter 0.2s;
    }
    .toast-close.style-loss   { background: #c0392b; }
    .toast-close.style-profit { background: #1e8449; }
    .toast-close.style-less   { background: #9a7519; }
    .toast-close.style-earn   { background: #1a5a8a; }
    .toast-close:hover { filter: brightness(1.2); }
  </style>
</head>
<body>

<h1>⚠ 違紀交易紀錄表</h1>
<p class="subtitle">記錄每一次不遵守紀律的結果，讓每次教訓成為成長的養分</p>

<!-- 統計卡片 -->
<div class="stats">
  <div class="card">
    <div class="card-label">總違紀次數</div>
    <div class="card-value gray" id="stat-count">0</div>
  </div>
  <div class="card" style="min-width:200px">
    <div class="card-label">違紀資金差異</div>
    <div class="card-value" id="stat-net">$0</div>
    <div style="font-size:0.68rem;color:#555;margin-top:4px">少虧/僥倖獲利 (+)　虧損/少賺 (−)</div>
  </div>
</div>

<!-- 新增表單 -->
<div class="form-box">
  <h2>＋ 新增一筆違紀紀錄</h2>
  <div class="form-row">
    <div class="field">
      <label>日期</label>
      <input type="date" id="inp-date">
    </div>
    <div class="field">
      <label>交易結果</label>
      <div class="result-toggle">
        <input type="radio" name="result" id="rt-loss" value="loss" checked>
        <input type="radio" name="result" id="rt-profit" value="profit">
        <input type="radio" name="result" id="rt-less" value="less">
        <input type="radio" name="result" id="rt-earn" value="earn">
        <label for="rt-loss">虧損</label>
        <label for="rt-profit">僥倖獲利</label>
        <label for="rt-less">少虧</label>
        <label for="rt-earn">少賺</label>
      </div>
    </div>
    <div class="field">
      <label>金額（元）</label>
      <input type="number" id="inp-amount" placeholder="例：5000" min="0">
    </div>
    <div class="field">
      <label>違紀類型</label>
      <select id="inp-cat">
        <option value="心態">心態問題</option>
        <option value="停損">未執行停損</option>
        <option value="倉位">倉位過重</option>
        <option value="進場">錯誤進場</option>
        <option value="出場">提早/延遲出場</option>
        <option value="其他">其他</option>
      </select>
    </div>
    <div class="field reason">
      <label>原因說明</label>
      <textarea id="inp-reason" placeholder="詳細描述這次沒有遵守紀律的原因…"></textarea>
    </div>
    <button class="add-btn" onclick="addRecord()">新增紀錄</button>
  </div>
</div>

<!-- 篩選列 -->
<div class="filter-row">
  <input type="month" id="filter-month" oninput="render()" style="max-width:150px">
  <select id="filter-result" onchange="render()">
    <option value="">全部結果</option>
    <option value="loss">虧損</option>
    <option value="profit">僥倖獲利</option>
    <option value="less">少虧</option>
    <option value="earn">少賺</option>
  </select>
  <select id="filter-cat" onchange="render()">
    <option value="">全部類型</option>
    <option value="心態">心態問題</option>
    <option value="停損">未執行停損</option>
    <option value="倉位">倉位過重</option>
    <option value="進場">錯誤進場</option>
    <option value="出場">提早/延遲出場</option>
    <option value="其他">其他</option>
  </select>
  <button class="clear-btn" onclick="clearFilters()">清除篩選</button>
</div>

<!-- 表格 -->
<div class="table-wrap">
  <table>
    <thead>
      <tr>
        <th onclick="sortBy('date')">日期 <span class="sort-arrow" id="sort-date"></span></th>
        <th onclick="sortBy('result')">結果 <span class="sort-arrow" id="sort-result"></span></th>
        <th onclick="sortBy('amount')">金額 <span class="sort-arrow" id="sort-amount"></span></th>
        <th onclick="sortBy('cat')">類型 <span class="sort-arrow" id="sort-cat"></span></th>
        <th>原因說明</th>
        <th></th>
      </tr>
    </thead>
    <tbody id="tbody"></tbody>
  </table>
</div>

<!-- 教訓彈出框 -->
<div class="toast-overlay" id="toast-overlay" onclick="closeToast(event)">
  <div class="toast-box" id="toast-box">
    <div class="toast-icon" id="toast-icon"></div>
    <div class="toast-amount" id="toast-amount"></div>
    <div class="toast-amount-label" id="toast-amount-label"></div>
    <hr class="toast-divider">
    <div class="toast-quote" id="toast-quote-text"></div>
    <button class="toast-close" id="toast-close-btn"
      onclick="document.getElementById('toast-overlay').classList.remove('show')">
      我記住了，下次一定做到
    </button>
  </div>
</div>

<div class="action-row" style="gap:10px">
  <input type="file" id="import-file-input" accept=".json" onchange="importJSON(event)">
  <button class="import-btn" onclick="document.getElementById('import-file-input').click()">匯入備份 JSON</button>
  <button class="export-btn" onclick="exportJSON()">備份匯出 JSON</button>
  <button class="export-btn" onclick="exportCSV()">匯出 CSV</button>
</div>

<script>
  /* ── 語錄庫 ── */
  const QUOTES_LOSS = [
    "如果無法遵守紀律，就不可能賺錢。紀律不是選項，是生存的條件。",
    "市場不會懲罰你的無知，只懲罰你的不紀律。每一筆違紀的虧損，都是你親手簽的帳單。",
    "沒有系統，你只是在賭博；有系統卻不執行，你連賭徒都不如。",
    "情緒是虧損的根源，紀律是獲利的護城河。選擇哪一個，你說了算。",
    "停損是保護資金的武器，拒絕停損的人，遲早把子彈全部射向自己。",
    "一個成功的交易者，不是因為他每次都對，而是因為他每次都執行。",
    "帳戶虧損可以補回來，但失去紀律的心態，才是最難修復的傷。",
    "真正的交易紀律是：不管感覺多強烈，計畫沒說可以做的，就是不做。",
    "倉位過重不是自信，是無知。市場隨時可以讓你歸零。",
    "最貴的學費，是你本可以避免卻沒有避免的虧損。記下來，別讓這學費白交。",
    "你的帳戶餘額，是你所有決策的總和。這筆虧損告訴你，哪裡還需要補強。",
    "賺錢靠的是耐心與紀律，虧錢靠的是衝動與僥倖。你今天選了哪一個？",
    "計畫之外的交易，從來不是機會，只是衝動。",
    "市場只獎勵做對事的人，不獎勵聰明的人。按計畫執行，才是最聰明的事。",
    "交易是機率的遊戲，唯有紀律才能讓機率站在你那邊。",
    "你輸的不是這一筆，而是再一次證明你還沒有準備好。",
    "沒有停損的交易者，不是在做生意，是在等待破產。",
    "每次你讓情緒替你做決策，市場就會替你教一堂課，而且收費不便宜。",
    "痛苦是最好的老師——但前提是你真的從中學習，而不只是感覺很痛。",
    "紀律不是限制你的鐵鍊，是保護你的盔甲。放棄盔甲的人，死得最快。",
    "你覺得「這次不一樣」的那一刻，就是最危險的時刻。",
    "成功的交易者不預測市場，只管理自己的行為。你今天管理好了嗎？",
    "扣下扳機容易，承受後果很難。想清楚再動，不要動了才後悔。",
    "你不是輸給市場，你是輸給你自己。市場只是照實反映了你的選擇。",
    "交易計畫是你冷靜時寫給衝動的自己的信。今天，你撕掉了那封信。",
    "一次違紀不致命，一次次違紀積累起來，才是毀掉帳戶的那根稻草。",
    "止損單是你的保險，不執行它，就像開車不繫安全帶，一次就夠了。",
    "最大的敵人從來不在市場裡，它每天早上跟你一起照鏡子。",
    "好的交易者不靠預感，靠系統。預感讓你進場，系統讓你活下去。",
    "這筆虧損不是壞運氣，是你那個決策的正常結果。承認它，改變它。",
    "每一個大虧損，都是由無數個「下不為例」堆積起來的。",
    "紀律在順境時很廉價，但在逆境時卻是無價之寶。現在你知道了。",
    "市場沒有義務配合你的感覺，但你有義務配合你的計畫。",
    "你今天的選擇，決定你明天還有沒有資格繼續交易。",
  ];

  const QUOTES_PROFIT = [
    "這次僥倖獲利，只是市場在給你留繩子——讓你套得更深。",
    "違紀獲利是最危險的結果。它讓你以為自己是對的，直到有一天你不是。",
    "每次違規還能賺錢，你就離爆倉更近一步。市場在用獎勵訓練你犯錯。",
    "僥倖不是技術，運氣不是系統。你以為你贏了，其實你輸了對紀律的敬畏。",
    "短期的僥倖，是長期虧損的預付款。記住這次，因為市場遲早要收回去。",
    "這次獲利不代表你做對了，只代表你還沒被懲罰。市場的帳是算長期的。",
    "用錯誤方式賺來的錢，通常會用更痛的方式還回去。",
    "成功的交易者害怕僥倖獲利，因為他們知道那只是在強化壞習慣。",
    "違紀而獲利，比違紀而虧損更可怕——因為你學到了錯誤的教訓。",
    "市場給你糖，是因為它知道你下次還會回來，而且帶著更大的倉位。",
    "隨機的獎勵是最有效的行為強化。賭場知道這個秘密，現在市場也用在你身上。",
    "這次賺了，所以你會繼續違紀。這正是你最終會爆倉的原因。",
    "偶爾的好運不能改變長期的機率，但它能改變你的行為——往壞的方向。",
    "一次僥倖獲利，換來的是對系統的輕視。代價比虧損更高。",
    "你今天違紀獲利了。你知道嗎？這是市場給你最殘忍的一個圈套。",
    "靠運氣賺的錢，靠實力是守不住的。",
    "今天市場原諒了你，但市場從不欠任何人第二次原諒。",
    "感覺良好不等於做對了。如果每次違紀都這樣結束，你早就有別墅了——但你沒有。",
    "這筆獲利，請從你的能力帳戶裡扣除，記入運氣帳戶。兩者不要搞混。",
    "違紀獲利就像在高速公路上逆向行駛剛好沒人來。你不會因此覺得安全吧？",
    "你今天撿到了錢，但你賠上了更重要的東西：對規則的尊重。",
    "市場短期是投票機，長期是稱重機。今天的票不算數。",
    "帳面上的獲利可以抹去，但壞習慣一旦固化，才是真正的虧損。",
    "運氣偏愛有準備的人，但它不會一直光顧沒有紀律的人。",
    "這次違紀成功，只是讓下一次的失敗更難承受。",
  ];

  const QUOTES_LESS = [
    "少虧不等於做對了。違紀就是違紀，結果好只是運氣，不是你的能力。",
    "這次少虧是幸運，下次可能就不是了。紀律是護身符，不能因為沒遇到鬼就丟掉它。",
    "即使結果還好，過程的錯誤就是錯誤。用結果合理化過程，是自我欺騙。",
    "少虧只是程度的問題，根本原因沒有改變。下次面對同樣情況，你還會再犯。",
    "不遵守計畫而少虧，就像闖紅燈沒遇到車。下次你還是會闖，直到那次剛好有車。",
    "結果減輕了痛苦，也減輕了你的警覺。這才是這次紀錄最危險的地方。",
    "少虧了，所以你覺得還好。「還好」正是讓你下次繼續犯錯的理由。",
    "違紀的錯誤是確定的，少虧的幸運是偶然的。不要把偶然當必然。",
    "你省下了一部分損失，但你付出了更高的代價：繼續相信違紀沒什麼大不了。",
    "過程錯了，結果運氣好，下次過程錯了，結果會如何？市場不保證永遠手下留情。",
    "少虧只代表這次市場對你客氣，不代表你的判斷是對的。",
    "計畫存在的意義，不只是限制虧損，更是讓你長期行為可預測、可複製。今天你破壞了這個基礎。",
    "這次你少虧了，那下次你還會遵守停損嗎？答案你心裡清楚。",
    "一個壞習慣在某次帶來小好處，並不會讓它變成好習慣。",
    "市場這次給你台階下，你接受了。但你的壞習慣，也跟著下來了。",
  ];

  const QUOTES_EARN = [
    "你本可以賺更多，但你選擇了違紀。少賺不只是錢的問題，是你對自己能力的浪費。",
    "提早出場、過早停利，都是對未來機會的提前放棄。紀律告訴你的出場點，是有原因的。",
    "少賺的金額是可以計算的，但少賺養成的壞習慣，代價是無法計算的。",
    "你覺得少賺沒關係。但如果每次都少賺 20%，你的年報酬率會變成什麼樣子？",
    "在正確的交易上不遵守紀律，跟在錯誤的交易上一樣糟糕。兩者都在消耗你的優勢。",
    "交易紀律不只是避免虧損，更是讓每一筆正確的判斷都能完整兌現。今天你砍掉了一半。",
    "少賺是一種隱性的損失。它不會讓你心痛，所以你不會記得——但它每次都在侵蝕你的績效。",
    "你的交易系統設計出場點，是為了在最有效率的地方退出。提前離場，等於白白浪費了進場的眼光。",
    "恐懼讓你早出場，貪婪讓你晚出場。兩者都是情緒，都違反紀律，都讓你少賺或多虧。",
    "正確的進場點 + 錯誤的出場點 = 打了折扣的成果。長期下來，折扣會把利潤全部吃光。",
    "每一次少賺，都是在告訴你的系統：你不信任它。不信任系統的人，最終只能靠運氣。",
    "如果你連該賺的錢都賺不滿，你憑什麼期待帳戶長期成長？",
    "違紀少賺跟違紀多虧，本質上是同一件事：你讓情緒取代了計畫。",
    "少賺的感覺往往比虧損更難處理，因為你『知道』自己本來可以更好。記住這個感覺，讓它提醒你下次做到。",
    "一個完整執行的交易，即使少賺，也比一個半途而廢的交易更有價值——因為後者破壞了你的系統。",
  ];

  /* ── 資料 ── */
  const STORAGE_KEY = 'discipline_records_v2';
  let records = JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]');
  let sortKey = 'date';
  let sortAsc = false;

  document.getElementById('inp-date').valueAsDate = new Date();

  function save() { localStorage.setItem(STORAGE_KEY, JSON.stringify(records)); }

  /* ── 新增 ── */
  function addRecord() {
    const date   = document.getElementById('inp-date').value;
    const result = document.querySelector('input[name=result]:checked').value;
    const amount = parseFloat(document.getElementById('inp-amount').value);
    const cat    = document.getElementById('inp-cat').value;
    const reason = document.getElementById('inp-reason').value.trim();

    if (!date)                     return alert('請填入日期');
    if (isNaN(amount) || amount < 0) return alert('請填入有效的金額');
    if (!reason)                   return alert('請填入原因說明');

    records.push({ id: Date.now(), date, result, amount, cat, reason });
    save();
    document.getElementById('inp-amount').value  = '';
    document.getElementById('inp-reason').value  = '';
    document.getElementById('inp-date').valueAsDate = new Date();
    document.getElementById('rt-loss').checked = true;
    render();
    showToast(result, amount);
  }

  /* ── 刪除 ── */
  function deleteRecord(id) {
    if (!confirm('確定要刪除這筆紀錄？')) return;
    records = records.filter(r => r.id !== id);
    save();
    render();
  }

  /* ── 排序 ── */
  function sortBy(key) {
    if (sortKey === key) sortAsc = !sortAsc;
    else { sortKey = key; sortAsc = true; }
    render();
  }

  /* ── 篩選 ── */
  function clearFilters() {
    document.getElementById('filter-month').value  = '';
    document.getElementById('filter-result').value = '';
    document.getElementById('filter-cat').value    = '';
    render();
  }

  function filtered() {
    const month  = document.getElementById('filter-month').value;
    const result = document.getElementById('filter-result').value;
    const cat    = document.getElementById('filter-cat').value;
    return records.filter(r => {
      if (month  && !r.date.startsWith(month)) return false;
      if (result && r.result !== result)        return false;
      if (cat    && r.cat !== cat)              return false;
      return true;
    });
  }

  /* ── 渲染 ── */
  const RESULT_LABEL = { loss: '虧損', profit: '僥倖獲利', less: '少虧', earn: '少賺' };

  function render() {
    const list = filtered().sort((a, b) => {
      let va = a[sortKey], vb = b[sortKey];
      if (sortKey === 'amount') { va = +va; vb = +vb; }
      if (va < vb) return sortAsc ? -1 : 1;
      if (va > vb) return sortAsc ?  1 : -1;
      return 0;
    });

    ['date','result','amount','cat'].forEach(k => {
      const el = document.getElementById('sort-' + k);
      if (el) el.textContent = sortKey === k ? (sortAsc ? '▲' : '▼') : '';
    });

    // 統計（全量資料）
    const net = records.reduce((s, r) => {
      const v = +r.amount;
      return s + (['less','profit'].includes(r.result) ? v : -v);
    }, 0);
    document.getElementById('stat-count').textContent = records.length;
    const netEl = document.getElementById('stat-net');
    netEl.textContent = (net >= 0 ? '+' : '-') + '$' + Math.abs(net).toLocaleString();
    netEl.className   = 'card-value ' + (net >= 0 ? 'green' : 'red');

    const tbody = document.getElementById('tbody');
    if (list.length === 0) {
      tbody.innerHTML = '<tr><td colspan="6"><div class="empty-msg">尚無符合條件的紀錄</div></td></tr>';
      return;
    }

    tbody.innerHTML = list.map(r => {
      const sign    = ['profit','less'].includes(r.result) ? '+' : '-';
      const amtCls  = 'td-amount is-' + r.result;
      return `
        <tr>
          <td class="td-date">${r.date}</td>
          <td class="td-cat">
            <span class="result-badge rb-${r.result}">${RESULT_LABEL[r.result]}</span>
            <span class="tag tag-${r.cat}">${r.cat}</span>
          </td>
          <td class="${amtCls}">${sign}$${(+r.amount).toLocaleString()}</td>
          <td class="td-cat" style="display:none"></td>
          <td class="td-reason">${escHtml(r.reason)}</td>
          <td><button class="del-btn" onclick="deleteRecord(${r.id})" title="刪除">✕</button></td>
        </tr>`;
    }).join('');
  }

  /* ── Toast ── */
  function showToast(result, amount) {
    const pool = result === 'loss' ? QUOTES_LOSS : result === 'profit' ? QUOTES_PROFIT : result === 'less' ? QUOTES_LESS : QUOTES_EARN;
    const q    = pool[Math.floor(Math.random() * pool.length)];

    const icons   = { loss: '💸', profit: '⚠️', less: '🎲', earn: '📉' };
    const labels  = { loss: '這次違紀的代價', profit: '這次僥倖獲利', less: '這次少虧金額', earn: '這次少賺金額' };
    const signs   = { loss: '-', profit: '+', less: '-', earn: '+' };
    const btntxt  = { loss: '我記住了，下次一定做到', profit: '我明白，這不代表我做對了', less: '我知道，過程的錯就是錯', earn: '我明白，該賺的要賺滿' };

    document.getElementById('toast-icon').textContent        = icons[result];
    document.getElementById('toast-amount').textContent      = signs[result] + '$' + (+amount).toLocaleString();
    document.getElementById('toast-amount').className        = 'toast-amount is-' + result;
    document.getElementById('toast-amount-label').textContent= labels[result];
    document.getElementById('toast-quote-text').textContent  = q;

    const box = document.getElementById('toast-box');
    box.className = 'toast-box style-' + result;

    const btn = document.getElementById('toast-close-btn');
    btn.textContent = btntxt[result];
    btn.className   = 'toast-close style-' + result;

    document.getElementById('toast-overlay').classList.add('show');
  }

  function closeToast(e) {
    if (e.target === document.getElementById('toast-overlay'))
      document.getElementById('toast-overlay').classList.remove('show');
  }

  function escHtml(s) {
    return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/\n/g,'<br>');
  }

  /* ── 備份匯出 JSON ── */
  function exportJSON() {
    if (!records.length) return alert('沒有資料可匯出');
    const blob = new Blob([JSON.stringify(records, null, 2)], { type: 'application/json' });
    const url  = URL.createObjectURL(blob);
    const a    = document.createElement('a');
    a.href = url; a.download = '違紀交易備份.json'; a.click();
    URL.revokeObjectURL(url);
  }

  /* ── 匯入 JSON ── */
  function importJSON(event) {
    const file = event.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = function(e) {
      try {
        const imported = JSON.parse(e.target.result);
        if (!Array.isArray(imported)) throw new Error();
        const existingIds = new Set(records.map(r => r.id));
        const newRecords  = imported.filter(r => !existingIds.has(r.id));
        records = [...records, ...newRecords];
        save();
        render();
        alert(`匯入完成！新增 ${newRecords.length} 筆，略過重複 ${imported.length - newRecords.length} 筆。`);
      } catch {
        alert('檔案格式錯誤，請選擇正確的備份 JSON 檔案。');
      }
    };
    reader.readAsText(file);
    event.target.value = '';
  }

  /* ── 匯出 CSV ── */
  function exportCSV() {
    const list = filtered();
    if (!list.length) return alert('沒有資料可匯出');
    const header = '日期,結果,金額,類型,原因說明\n';
    const rows = list.map(r =>
      `${r.date},${RESULT_LABEL[r.result]},${(r.result === 'profit' || r.result === 'earn') ? '+' : '-'}${r.amount},${r.cat},"${r.reason.replace(/"/g,'""')}"`
    ).join('\n');
    const blob = new Blob(['﻿' + header + rows], { type: 'text/csv;charset=utf-8;' });
    const url  = URL.createObjectURL(blob);
    const a    = document.createElement('a');
    a.href = url; a.download = '違紀交易紀錄.csv'; a.click();
    URL.revokeObjectURL(url);
  }

  render();
</script>
</body>
</html>
